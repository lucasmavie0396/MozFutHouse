<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>MozFutHouse · Gestão de campeonato de futsal</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        if (window.location.protocol !== 'file:') return;
        var URL_DEV = 'http://localhost:5173/';
        function mostrarAviso() {
          var root = document.getElementById('root');
          if (!root) return;
          root.style.cssText = 'font-family:Inter,sans-serif;color:#ECEFF4;background:#0B1220;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;';
          root.innerHTML =
            '<div>' +
            '<div style="font-family:Oswald,sans-serif;font-size:1.4rem;font-weight:600;margin-bottom:8px">MozFutHouse</div>' +
            '<p style="color:#8C99B5;font-size:0.92rem;line-height:1.7;max-width:430px;margin:0">' +
            'O projecto não pode ser aberto diretamente a partir do ficheiro.<br/>Abra um terminal na pasta do projecto, execute <code style="background:#121B2E;border:1px solid #26314A;padding:2px 6px;color:#F2B807">npm run dev</code> e depois visite ' +
            '<a href="http://localhost:5173/" style="color:#F2B807">http://localhost:5173/</a>' +
            '</p></div>';
        }
        fetch(URL_DEV, { mode: 'no-cors' })
          .then(function () { window.location.replace(URL_DEV); })
          .catch(mostrarAviso);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
