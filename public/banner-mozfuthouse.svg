<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#121B2E"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2B807"/>
      <stop offset="100%" stop-color="#D4A006"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#g1)"/>

  <!-- Decorative diagonal stripes -->
  <g opacity="0.06">
    <rect x="0" y="0" width="160" height="320" fill="#F2B807" transform="skewX(-12) translate(-40,0)"/>
    <rect x="200" y="0" width="120" height="320" fill="#F2B807" transform="skewX(-12) translate(-40,0)"/>
    <rect x="900" y="0" width="180" height="320" fill="#F2B807" transform="skewX(-12) translate(40,0)"/>
    <rect x="1100" y="0" width="140" height="320" fill="#F2B807" transform="skewX(-12) translate(40,0)"/>
  </g>

  <!-- Left gold accent bar -->
  <rect x="0" y="0" width="8" height="320" fill="#F2B807"/>

  <!-- Logo mark: M -->
  <g transform="translate(60, 70)">
    <rect width="80" height="80" rx="16" fill="#0B1220" stroke="#F2B807" stroke-width="3"/>
    <text x="40" y="60" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" text-anchor="middle" fill="#F2B807">M</text>
  </g>

  <!-- MozFutHouse title -->
  <text x="160" y="110" font-family="Oswald, Arial, sans-serif" font-size="52" font-weight="700" fill="#ECEFF4" letter-spacing="1">Moz</text>
  <text x="290" y="110" font-family="Oswald, Arial, sans-serif" font-size="52" font-weight="700" fill="#F2B807" letter-spacing="1">Fut</text>
  <text x="395" y="110" font-family="Oswald, Arial, sans-serif" font-size="52" font-weight="700" fill="#ECEFF4" letter-spacing="1">House</text>

  <!-- Tagline -->
  <text x="160" y="145" font-family="Inter, Arial, sans-serif" font-size="18" fill="#8C99B5" letter-spacing="0.5">Gestão de Campeonatos de Futsal em Moçambique</text>

  <!-- Divider line -->
  <rect x="160" y="162" width="400" height="2" fill="#26314A" rx="1"/>
  <rect x="160" y="162" width="120" height="2" fill="#F2B807" rx="1"/>

  <!-- Feature bullets -->
  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#8C99B5">
    <circle cx="170" cy="200" r="5" fill="#12A150"/>
    <text x="182" y="205">Classificação em tempo real</text>

    <circle cx="170" cy="232" r="5" fill="#12A150"/>
    <text x="182" y="237">Transmissões ao vivo</text>

    <circle cx="170" cy="264" r="5" fill="#12A150"/>
    <text x="182" y="269">Artilharia e estatísticas</text>
  </g>

  <!-- Right side CTA -->
  <g transform="translate(860, 180)">
    <text x="0" y="0" font-family="Oswald, Arial, sans-serif" font-size="20" font-weight="600" fill="#ECEFF4" letter-spacing="0.5">Aceda agora</text>
    <rect x="0" y="14" width="140" height="50" rx="6" fill="url(#g2)"/>
    <text x="70" y="46" font-family="Oswald, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B1220" text-anchor="middle">MOZFUTHOUSE</text>
  </g>

  <!-- Football icon (decorative) -->
  <g transform="translate(1050, 70)" opacity="0.12">
    <circle cx="50" cy="50" r="48" fill="none" stroke="#F2B807" stroke-width="3"/>
    <path d="M50,2 L50,98 M2,50 L98,50 M16,16 L84,84 M84,16 L16,84" stroke="#F2B807" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="316" width="1200" height="4" fill="#F2B807"/>
</svg>